name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (tvOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 or newer
        run: |
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          if [ "$major" -lt 26 ]; then
            candidate=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
            if [ -z "$candidate" ]; then
              echo "::error::Kein Xcode >= 26 auf dem Runner gefunden"
              ls -d /Applications/Xcode*.app
              exit 1
            fi
            sudo xcode-select -s "$candidate"
          fi
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project BoschCameraTV.xcodeproj \
            -scheme BoschCameraTV \
            -destination 'generic/platform=tvOS Simulator' \
            | tee build.log | grep -E "warning:|error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Find Apple TV simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, entries in devices.items():
              match = re.search(r"tvOS-(\d+)-(\d+)", runtime)
              if not match or int(match.group(1)) < 26:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in entries:
                  if device.get("isAvailable") and (best is None or version > best[0]):
                      best = (version, device["udid"])
          print(best[1] if best else "")
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          if [ -z "$udid" ]; then
            echo "::warning::Kein Apple-TV-Simulator mit tvOS >= 26 verfügbar – Tests werden übersprungen"
          fi

      - name: Test
        if: steps.simulator.outputs.udid != ''
        run: |
          set -o pipefail
          xcodebuild test \
            -project BoschCameraTV.xcodeproj \
            -scheme BoschCameraTV \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            | tee test.log | grep -E "error:|✘|✔ Test run|Test run with|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test.log
